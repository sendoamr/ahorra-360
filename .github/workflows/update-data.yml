name: Update verified data
on:
  schedule: [{cron: '17 5 * * 1'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run data:update
      - run: npm test
      - run: npm run build
      - name: Commit only valid changes
        run: |
          if git diff --quiet -- data/; then exit 0; fi
          git config user.name "ahorra360-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: weekly catalog update"
          git push
