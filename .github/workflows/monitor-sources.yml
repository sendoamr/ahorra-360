name: Monitor de fuentes oficiales
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run source monitor
        run: python3 scripts/monitor_sources.py
      - name: Commit monitor report
        run: |
          if ! git diff --quiet -- data/source-monitor.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/source-monitor.json
            git commit -m "chore: update official source monitoring report"
            git push
          fi
